# npanel and a reverse proxy, which is the whole of a production install.
#
#   cp .env.example .env      # set DASHBOARD_HOST
#   $EDITOR .env
#   docker compose up -d
#   docker compose exec npanel bun run make-admin npub1yourkeyhere
#
# Caddy gets a certificate for every hostname staff add, asking npanel first
# whether that hostname is configured. See docs/deployment.md.

name: npanel

services:
  npanel:
    build: .
    image: npanel
    restart: unless-stopped
    # Deliberately no `ports`: both listeners exist for the proxy alone. npanel
    # speaks plain HTTP, and 3001 authorizes certificates without asking who
    # wants to know.
    expose:
      - "3000"
      - "3001"
    environment:
      # The public hostname of the dashboard. Required — it decides which
      # requests are the dashboard rather than an nsite, and NIP-98 logins are
      # checked against it.
      DASHBOARD_HOST: ${DASHBOARD_HOST:?set DASHBOARD_HOST in .env, eg panel.example.com}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # The database and the blob store. This is the volume to back up.
      - npanel-data:/data
      # Tor's control cookie, which npanel reads to authenticate. Read-only, and
      # mounted at the same path Tor uses because Tor names that path itself when
      # asked how to authenticate.
      - tor-data:/var/lib/tor:ro

  # Tor, for the onion address every site gets once an admin turns it on under
  # Settings. Sharing npanel's network namespace puts both the control port and
  # the port Tor forwards onion traffic to on plain loopback — the same
  # addresses Tor installed beside npanel would use, so the default settings are
  # already right and neither port is reachable from anywhere else.
  #
  # The cost of sharing a namespace is that restarting npanel takes this
  # container down with it. `unless-stopped` brings it back.
  tor:
    build: ./tor
    image: npanel-tor
    restart: unless-stopped
    network_mode: "service:npanel"
    depends_on:
      - npanel
    volumes:
      # Tor's own state, and the control cookie shared with npanel. Onion keys
      # are not here — npanel keeps those in its database, which is what makes
      # an address survive this volume being lost.
      - tor-data:/var/lib/tor

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      # Caddy asks npanel before issuing any certificate, and proxies to it.
      # Waiting avoids serving 502s and denying certificates during startup.
      npanel:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DASHBOARD_HOST: ${DASHBOARD_HOST:?set DASHBOARD_HOST in .env, eg panel.example.com}
      # The sample Caddyfile defaults to loopback, for a proxy installed on the
      # host. Here npanel is a container on this network, and its certificate
      # authorization answers on a second port.
      NPANEL_UPSTREAM: npanel:3000
      NPANEL_TLS_CHECK: npanel:3001
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Losing this means re-issuing every
      # certificate, which Let's Encrypt rate limits.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  npanel-data:
  tor-data:
  caddy-data:
  caddy-config:
