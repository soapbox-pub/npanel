# What `ngit release publish` publishes for a version tag: the NIP-82
# application, release, and asset events, with the files on Blossom. Run by
# .ngit/act/workflows/release.yml once the files below are built.
schema: 1
application: npanel
# Every release of an application has to come from the key that published the
# first, so publishing fails before anything is uploaded under another one.
pubkey: npub10qdp2fc9ta6vraczxrcs8prqnv69fru2k6s2dj48gqjcylulmtjsg9arpj
name: npanel
summary: Self-hostable nsite gateway with a team dashboard
description: |
  Map hostnames to nsites in a web dashboard. npanel downloads each site's
  files from Blossom servers and serves them from its own disk, with TLS,
  analytics, and onion addresses. One binary and one SQLite file.
tags: [nostr, nsite, blossom, gateway]
license: AGPL-3.0-or-later
repository: nostr://npub10qdp2fc9ta6vraczxrcs8prqnv69fru2k6s2dj48gqjcylulmtjsg9arpj/git.shakespeare.diy/npanel
icon: dashboard/public/icon-512.png
release_notes: CHANGELOG.md
publication:
  # The same servers and relays as the dashboard's nsite (.nsite/config.json).
  blossom_servers:
    - https://blossom.ditto.pub
    - https://blossom.dreamith.to
    - https://blossom.primal.net
  relays:
    - wss://relay.ditto.pub
    - wss://relay.dreamith.to
    - wss://relay.primal.net
assets:
  - file: dist/npanel-{version}-linux-x86_64
    platforms: [linux-x86_64]
  - file: dist/npanel-{version}-linux-aarch64
    platforms: [linux-aarch64]
  # The same binaries, packaged; told apart from them by their MIME types.
  - file: dist/npanel-{version}-linux-x86_64.deb
    platforms: [linux-x86_64]
  - file: dist/npanel-{version}-linux-aarch64.deb
    platforms: [linux-aarch64]
  - file: dist/npanel-{version}-linux-x86_64.rpm
    platforms: [linux-x86_64]
  - file: dist/npanel-{version}-linux-aarch64.rpm
    platforms: [linux-aarch64]
