name: Release

# A version tag (vX.Y.Z) publishes:
#
#   - static Linux binaries for x86_64 and aarch64 with the dashboard compiled
#     in, and the same binaries as .deb and .rpm packages (contrib/package/),
#     as a NIP-82 release (.ngit/release.yaml, notes from CHANGELOG.md), whose
#     asset events carry each file's SHA-256;
#   - the same dashboard build as the named nsite "npanel" (.nsite/config.json),
#     which manages any npanel server across origins.
#
# One job, in order, so nothing is handed between containers and the nsite only
# moves once the release it belongs to is out. The nsite follows tags rather
# than main because servers lag behind it: a dashboard built from main could
# lean on API nobody has deployed yet. The binaries are also uploaded as run
# artifacts before anything is published, so a failed publish still leaves
# them on the CI result.
#
# ── Secrets ──────────────────────────────────────────────────────────────────
#   NSYTE_BUNKER   nbunksec1... — a remote signer session on the Soapbox key
#                  (npub10qdp2…), the same one armada-stack's releases and
#                  Armada's nsite use. That key owns the npanel application
#                  (`pubkey` in .ngit/release.yaml refuses any other) and is
#                  the nsite's address. The coordinator's #SOAPBOX alias only
#                  covers the Soapbox key's own repositories, so this one needs
#                  it provisioned separately.
#
# act enforces a step's `timeout-minutes` but not a job's, so the steps that
# talk to the network carry their own.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Pinned with their checksums: these run with the release signer in the
      # environment.
      ZIG_VERSION: 0.16.0
      ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      ZIGBUILD_VERSION: 0.23.4
      ZIGBUILD_SHA256: 9e3cf73485edbd45905c8aadbc0fdf869c7ddc3848f0c898229f2680db52e44b
      NFPM_VERSION: 2.47.0
      NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
    steps:
      - uses: actions/checkout@v4

      # Before any building, so a forgotten bump or changelog entry costs
      # seconds rather than a whole build.
      - name: Check the tag against Cargo.toml and CHANGELOG.md
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match Cargo.toml's version $version. Bump Cargo.toml, or tag v$version." >&2
            exit 1
          fi
          if ! grep -qE "^## \[?v?$version\]?( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $version. Add one and tag again." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      # rust-toolchain.toml says which Rust; rustup installs it, and both musl
      # targets with it. zig is the C compiler and linker for both, since ring,
      # the bundled SQLite and QuickJS are C. nfpm builds the packages.
      - name: Install Rust, zig, cargo-zigbuild and nfpm
        run: |
          set -eu
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install

          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          cd "$tools"
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c -
          tar -xJf zig.tar.xz
          curl -fsSL -o zigbuild.tar.xz "https://github.com/rust-cross/cargo-zigbuild/releases/download/v$ZIGBUILD_VERSION/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz"
          echo "$ZIGBUILD_SHA256  zigbuild.tar.xz" | sha256sum -c -
          tar -xJf zigbuild.tar.xz
          curl -fsSL -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  nfpm.tar.gz" | sha256sum -c -
          mkdir nfpm
          tar -xzf nfpm.tar.gz -C nfpm
          echo "$tools/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
          echo "$tools/cargo-zigbuild-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
          echo "$tools/nfpm" >> "$GITHUB_PATH"

      - name: Restore the Rust build cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: release-zig-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: release-zig-

      - name: Test
        run: cargo test --locked

      - name: Build the dashboard
        working-directory: dashboard
        run: |
          set -eu
          # A cache of this run's own: the runner shares its home between
          # runs, and two installs at once into one cache can corrupt it.
          export BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/bun-cache"
          bun install --frozen-lockfile
          bun run build

      - name: Build the binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          # zig's linker holds every object file open at once, and there are
          # more than the default soft limit since Arti.
          ulimit -n "$(ulimit -Hn)"
          mkdir -p dist
          # The runner's image points CARGO_TARGET_DIR at a directory every
          # run shares.
          for arch in x86_64 aarch64; do
            cargo zigbuild --release --locked --target "$arch-unknown-linux-musl" --features embedded-dashboard
            cp "${CARGO_TARGET_DIR:-target}/$arch-unknown-linux-musl/release/npanel" "dist/npanel-$VERSION-linux-$arch"
          done
          # A musl binary that still asks for a dynamic loader fails on glibc
          # hosts with a misleading "No such file or directory"; refuse to
          # publish one.
          for bin in dist/npanel-*; do
            if readelf -l "$bin" | grep -q 'program interpreter'; then
              echo "$bin is dynamically linked." >&2
              exit 1
            fi
          done

      - name: Build the packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          for arch in x86_64 aarch64; do
            contrib/package/build.sh "$VERSION" "$arch" "dist/npanel-$VERSION-linux-$arch" dist
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: npanel-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

      - uses: danconwaydev/setup-ngit@v3
        with:
          version: 3.0.3

      # A file rather than the command line, so the session stays out of the
      # process list.
      - name: Write the signer
        env:
          NSYTE_BUNKER: ${{ secrets.NSYTE_BUNKER }}
        run: |
          set -eu
          # No apostrophes in that message: bash reads one inside ${var:?word}
          # as opening a quoted section, even within double quotes.
          : "${NSYTE_BUNKER:?NSYTE_BUNKER is not set. Ask the ngit-ci operator to provision the Soapbox session for this repository.}"
          umask 077
          printf '%s' "$NSYTE_BUNKER" > "$RUNNER_TEMP/nbunksec"

      # The checkout has the tagged commit but not the tag itself, so the
      # version and commit are given rather than found. A version with a suffix
      # (0.3.0-rc.1) is a pre-release, on its own channel so that clients
      # following main never offer it.
      - name: Publish the release
        timeout-minutes: 20
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          channel=main
          case "$VERSION" in *-*) channel=beta ;; esac
          ngit --nbunksec-file "$RUNNER_TEMP/nbunksec" release publish "$VERSION" \
            --repo nostr://npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/git.shakespeare.diy/npanel \
            --commit "$GITHUB_SHA" \
            --channel "$channel" \
            --defaults

      - name: Publish the dashboard nsite
        timeout-minutes: 15
        run: |
          set -eu
          ngit --nbunksec-file "$RUNNER_TEMP/nbunksec" nsite publish dashboard/dist \
            --repo nostr://npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/git.shakespeare.diy/npanel \
            --defaults

      - name: Remove the signer
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/nbunksec"
