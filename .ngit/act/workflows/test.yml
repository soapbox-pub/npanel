name: Test

# The checks from AGENTS.md, on every branch push and every Nostr PR. Tags are
# release.yml's.
#
# `["*", "**"]`: ngit-ci treats a bare `*` as matching every branch, slashes
# included, and a bare `**` as matching none; GitHub splits the two the other
# way. The pair is right under both.

on:
  push:
    branches: ["*", "**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore the Rust build cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
            vendor/device-detector/target
          key: test-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Server tests
        run: cargo test --locked

      - name: Device detector tests
        run: cargo test --locked --manifest-path vendor/device-detector/Cargo.toml

      # tsc, eslint, vitest, and a production build. Built before the
      # embedded-dashboard check below, which needs dashboard/dist.
      - name: Dashboard tests
        working-directory: dashboard
        run: |
          set -eu
          bun install --frozen-lockfile
          bun run test

      - name: Embedded dashboard
        run: |
          cargo clippy --all-targets --locked --features embedded-dashboard -- -D warnings
          cargo test --locked --features embedded-dashboard dashboard::
