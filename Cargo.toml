[package]
name = "npanel"
version = "0.6.1"
edition = "2021"
rust-version = "1.92"
description = "Self-hostable nsite gateway with a team dashboard"
license = "AGPL-3.0-or-later"
default-run = "npanel"

[[bin]]
name = "npanel"
path = "src/main.rs"

[dependencies]
# What a site's preview script writes for crawlers to read, cleaned.
ammonia = "4"
anyhow = "1"
arc-swap = "1"
# Tor, built in. Pinned exactly, Arti and its crates together: npanel uses
# APIs Arti still marks experimental, which change between its releases.
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "onion-service-service", "onion-service-cli-extra", "ephemeral-keystore"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path", "original-uri"] }
base64 = "0.22"
brotli = "8"
bytes = "1.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
device-detector = { path = "vendor/device-detector" }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hex = "0.4"
idna = "1"
imagesize = "0.15"
indexmap = { version = "2", features = ["serde"] }
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1", "http2"] }
# ACME, for https_port. Its own HTTP client is left out: requests go through
# reqwest, so the CA is trusted by the same compiled-in roots as everything else.
instant-acme = { version = "0.8", default-features = false, features = ["ring", "rcgen"] }
jpeg-encoder = { version = "0.7", features = ["simd"] }
libc = "0.2"
lru = "0.12"
maxminddb = { version = "0.26", features = ["mmap"] }
memmap2 = "0.9"
parking_lot = "0.12"
rand = "0.8"
# The script a site publishes to draw its own link previews: QuickJS, with a
# memory limit and an interrupt for its deadline.
rquickjs = { version = "0.14", features = ["futures", "loader", "array-buffer"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
regex = "1"
# The canvas a site's preview script draws on, in the fonts installed on the
# system.
resvg = { version = "0.48", default-features = false, features = ["text", "raster-images", "system-fonts", "memmap-fonts"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
safelog = "0.10"
svgtypes = "0.16"
scraper = "0.23"
secp256k1 = { version = "0.30", features = ["global-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
# The config file. Arti builds it already.
toml = "1"
tor-cell = "=0.47.0"
tor-config = "=0.47.0"
tor-hscrypto = "=0.47.0"
tor-hsservice = "=0.47.0"
tor-keymgr = "=0.47.0"
tor-llcrypto = "=0.47.0"
tor-proto = "=0.47.0"
tor-rtcompat = "=0.47.0"
tower = { version = "0.5", features = ["util"] }
url = "2"
# The routes a site's preview script declares, as the web standard has them.
urlpattern = "0.6"
x509-parser = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
sourcemap = "9"

# The process a site's preview script runs in, confined: no files, no
# sockets, no other processes.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"

[features]
# Compile dashboard/dist into the binary (see build.rs). Release builds use it;
# without it the dashboard is read from disk, so it can be rebuilt live.
embedded-dashboard = []

# Soapbox's fork of Arti, a branch per release it patches. Its relay selection
# compares family members as plain bytes: upstream's constant-time comparison
# kept the Tor of a gateway with many onion services too busy to stay
# reachable. The branch must match the release arti-client is pinned to.
# Every Arti crate npanel uses is listed: the fork's crates depend on each
# other by path, so one taken from crates.io would be a second copy whose
# types don't match.
[patch.crates-io]
arti-client              = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
caret                    = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
fslock-guard             = { git = "https://git.shakespeare.diy/npub1q3sle0kvfsehgsuexttt3ugjd8xdklxfwwkh559wxckmzddywnws6cd26p/arti.git", branch = "soapbox-v2.7.0" }
