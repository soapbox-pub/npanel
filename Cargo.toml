[package]
name = "npanel"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
description = "Self-hostable nsite gateway with a team dashboard"
license = "AGPL-3.0-or-later"
default-run = "npanel"

[[bin]]
name = "npanel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
# Tor, built in. Pinned exactly, Arti and its crates together: npanel uses
# APIs Arti still marks experimental, which change between its releases.
arti-client = { version = "=0.47.0", default-features = false, features = ["tokio", "rustls", "onion-service-service", "onion-service-cli-extra", "ephemeral-keystore"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path", "original-uri"] }
base64 = "0.22"
brotli = "8"
bytes = "1.9"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
device-detector = { path = "vendor/device-detector" }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hex = "0.4"
idna = "1"
indexmap = "2"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1", "http2"] }
# ACME, for HTTPS_PORT. Its own HTTP client is left out: requests go through
# reqwest, so the CA is trusted by the same compiled-in roots as everything else.
instant-acme = { version = "0.8", default-features = false, features = ["ring", "rcgen"] }
lru = "0.12"
maxminddb = { version = "0.26", features = ["mmap"] }
memmap2 = "0.9"
parking_lot = "0.12"
# Articles, rendered for crawlers: the HTML writer, without the command-line
# tool's dependencies.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
safelog = "0.10"
scraper = "0.23"
secp256k1 = { version = "0.30", features = ["global-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tor-cell = "=0.47.0"
tor-config = "=0.47.0"
tor-hscrypto = "=0.47.0"
tor-hsservice = "=0.47.0"
tor-keymgr = "=0.47.0"
tor-llcrypto = "=0.47.0"
tor-proto = "=0.47.0"
tor-rtcompat = "=0.47.0"
tower = { version = "0.5", features = ["util"] }
url = "2"
x509-parser = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[features]
# Compile dashboard/dist into the binary (see build.rs). Release builds use it;
# without it the dashboard is read from disk, so it can be rebuilt live.
embedded-dashboard = []

[dev-dependencies]
tempfile = "3"

# Tests and debugging need file and line in a backtrace, not full debug info;
# dependencies need neither. Most of what a debug build links is debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# What `cargo build --release` makes: optimized, but quick to rebuild, for
# running locally and deploying by hand. Symbols are stripped because they are
# a fifth of the binary and only name functions in a panic's backtrace.
[profile.release]
strip = "symbols"
incremental = true

# What a release publishes (.ngit/act/workflows/release.yml): the smallest and
# fastest binary, at the price of a much slower build.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
