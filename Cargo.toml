[dev-dependencies]
tempfile = "3"
# Paused time, for what waits out a timeout.
tokio = { version = "1", features = ["test-util"] }

# Tests and debugging need file and line in a backtrace, not full debug info;
# dependencies need neither. Most of what a debug build links is debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# What a release publishes (.ngit/act/workflows/release.yml), and what to
# deploy: the smallest and fastest binary, at the price of a build that takes
# minutes. Symbols are stripped because they are a fifth of the binary and only
# name functions in a panic's backtrace.
[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1
