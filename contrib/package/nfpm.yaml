# The .deb and .rpm each release publishes, built by build.sh, which sets the
# variables below and runs nfpm in a directory holding every file named here. They install what docs/deployment.md does by hand, in the
# places a package belongs: the binary in /usr/bin rather than /usr/local/bin,
# and the unit with the distribution's.
name: npanel
version: ${NPANEL_VERSION}
arch: ${NPANEL_ARCH}
platform: linux
section: net
priority: optional
maintainer: Soapbox <contact@soapbox.pub>
description: Self-hostable nsite gateway with a team dashboard
homepage: https://gitworkshop.dev/alex@gleasonator.com/git.shakespeare.diy/npanel
license: AGPL-3.0-or-later

# The binary is static; systemd is for the unit, and for the scripts, which
# create the user and DATA_DIR with systemd-sysusers and systemd-tmpfiles.
# Fonts are what a site's link-preview script draws its text in; without any,
# previews have none.
depends:
  - systemd
overrides:
  deb:
    recommends:
      - fonts-dejavu-core
      - fonts-noto-color-emoji
  rpm:
    recommends:
      - dejavu-sans-fonts
      - google-noto-color-emoji-fonts

contents:
  - src: npanel
    dst: /usr/bin/npanel
    file_info:
      mode: 0755
  - src: npanel.service
    dst: /usr/lib/systemd/system/npanel.service
    file_info:
      mode: 0644
  - src: sysusers.conf
    dst: /usr/lib/sysusers.d/npanel.conf
    file_info:
      mode: 0644
  - src: tmpfiles.conf
    dst: /usr/lib/tmpfiles.d/npanel.conf
    file_info:
      mode: 0644
  # Never replaced on upgrade once installed; dpkg removes it on purge.
  - src: env
    dst: /etc/npanel/.env
    type: config|noreplace
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/npanel/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/npanel/LICENSE
    packager: rpm
    file_info:
      mode: 0644

scripts:
  postinstall: postinstall.sh
  preremove: preremove.sh
  postremove: postremove.sh
