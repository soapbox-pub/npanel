[test]
# The dashboard has its own test runner (vitest, with a DOM environment). Without
# this, `bun test` walks into dashboard/src and fails on tests it can't run.
root = "src"

[run]
# biome and tsc ship `#!/usr/bin/env node` shebangs in node_modules/.bin.
# Without this, `bun run` honors them and shells out to a real Node, which
# npanel doesn't otherwise require. Bun substitutes itself instead.
bun = true
